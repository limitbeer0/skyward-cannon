[package]
name = "skyward-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "skyward-pack"
path = "src/main.rs"

[dependencies]
abootimg-oxide = "0.5.2"
anyhow = { workspace = true }
clap = { version = "4.5.51", features = ["derive"] }
cpio = "0.4.1"
# A device's kernel unpacks its ramdisk only in the formats its own
# CONFIG_RD_* options allow, so the packer has to write them itself; the host
# has no external compressor to call and none may be installed.
flate2 = "1.1.10"
lz4_flex = "0.14.0"
# A header up to version 2 carries its own digest of the sections after it,
# which has to be taken again over the ramdisk the packer wrote.
sha1 = "0.10.7"
sha2 = "0.10.9"
skyward-config = { path = "../skyward-config" }
tempfile = "3.27.0"
# Takes the stock recovery partition out of a full update package on its
# server, reading only what that partition takes.
unpayload = { version = "0.1.1", default-features = false, features = ["http"] }

[dev-dependencies]
serde_json = "1.0.145"
